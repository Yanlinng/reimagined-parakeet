<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560">
  <style>
    .wire{fill:none;stroke:#15312d;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .component{fill:#fff;stroke:#15312d;stroke-width:3}
    .value{font:700 18px Segoe UI,sans-serif;fill:#15312d}
    .note{font:15px Segoe UI,sans-serif;fill:#5d6b66}
    .load{fill:none;stroke:#d7643c;stroke-width:3;stroke-dasharray:8 6}
    .port{fill:none;stroke:#08736c;stroke-width:3}
    .ground{fill:none;stroke:#15312d;stroke-width:3;stroke-linecap:round}
  </style>
  <rect width="920" height="560" fill="#fff"/>
  <text x="54" y="56" font-family="Segoe UI,sans-serif" font-size="26" font-weight="700" fill="#15312d">Thevenin Source Network</text>
  <text x="56" y="84" class="note">Vs = 12 V, R1 = 2 kOhm, R2 = 4 kOhm, RL = 2 kOhm</text>

  <path class="wire" d="M100 180h80M180 180h105M285 180h190M475 180h220"/>
  <path class="wire" d="M100 180v230M285 180v230M475 180v230M695 180v230"/>
  <path class="wire" d="M100 410h595"/>

  <g transform="translate(100 180)">
    <circle r="40" class="component"/>
    <path class="wire" d="M-20-12h40M-20 12h40"/>
    <path class="wire" d="M-9-23v11M-9 12v11"/>
  </g>
  <text x="100" y="250" text-anchor="middle" class="value">Vs</text>
  <text x="100" y="273" text-anchor="middle" class="note">12 V DC</text>

  <g transform="translate(180 150)">
    <rect x="0" y="0" width="105" height="60" rx="5" class="component"/>
    <text x="53" y="38" text-anchor="middle" class="value">R1 2k</text>
  </g>

  <g transform="translate(385 245)">
    <rect x="0" y="0" width="90" height="90" rx="5" class="component"/>
    <path class="wire" d="M0 0v-65M90 0v-65M0 90v65M90 90v65"/>
    <text x="45" y="52" text-anchor="middle" class="value">R2</text>
    <text x="45" y="76" text-anchor="middle" class="value">4k</text>
  </g>

  <g transform="translate(695 210)">
    <circle cx="0" cy="0" r="7" class="port"/>
    <circle cx="0" cy="200" r="7" class="port"/>
    <text x="22" y="-14" class="value" fill="#08736c">A</text>
    <text x="22" y="226" class="value" fill="#08736c">B</text>
  </g>

  <g transform="translate(745 240)">
    <path class="load" d="M-12 0h36v28h-36v28h36v28h-36v28h36v28h-36v28h36v28"/>
    <path class="load" d="M12 0v188"/>
    <text x="72" y="76" class="value" fill="#d7643c">RL</text>
    <text x="72" y="102" class="value" fill="#d7643c">2k</text>
  </g>

  <text x="465" y="145" class="value">Output port: A-B</text>
  <text x="650" y="142" class="note">open for Voc</text>
  <text x="650" y="166" class="note">short for Isc</text>

  <g transform="translate(100 410)">
    <path class="ground" d="M0 0v20M-25 20h50M-16 30h32M-7 40h14"/>
  </g>
  <g transform="translate(285 410)">
    <path class="ground" d="M0 0v20M-25 20h50M-16 30h32M-7 40h14"/>
  </g>
  <g transform="translate(475 410)">
    <path class="ground" d="M0 0v20M-25 20h50M-16 30h32M-7 40h14"/>
  </g>

  <rect x="54" y="480" width="812" height="52" rx="4" fill="#e4f0ed" stroke="#08736c"/>
  <text x="75" y="513" class="value" fill="#08736c">Voc = 8 V, Isc = 6 mA, Rth = R1 || R2 = 1333.333 Ohm</text>
</svg>

