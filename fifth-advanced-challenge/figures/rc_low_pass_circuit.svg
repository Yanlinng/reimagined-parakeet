    <text x="25" y="-18" text-anchor="middle" class="value">C1</text>
    <text x="25" y="126" text-anchor="middle" class="value">100 nF</text>
  </g>

  <text x="137" y="147" class="value">Vin</text>
  <text x="348" y="147" class="value">Node A</text>
  <text x="600" y="147" class="value">Vout</text>

