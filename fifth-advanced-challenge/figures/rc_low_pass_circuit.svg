<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500">
  <style>
    .wire{fill:none;stroke:#15312d;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .component{fill:#fff;stroke:#15312d;stroke-width:3}
    .value{font:700 18px Segoe UI,sans-serif;fill:#15312d}
    .note{font:15px Segoe UI,sans-serif;fill:#5d6b66}
    .accent{fill:none;stroke:#08736c;stroke-width:3}
