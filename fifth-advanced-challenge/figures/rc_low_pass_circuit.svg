  </style>
  <rect width="920" height="500" fill="#fff"/>
  <text x="54" y="58" font-family="Segoe UI,sans-serif" font-size="26" font-weight="700" fill="#15312d">RC Low-Pass Filter</text>
  <text x="56" y="86" class="note">Self-selected parameters: R = 1.6 kOhm, C = 100 nF, fc = 994.718 Hz</text>

  <path class="wire" d="M110 170h65M175 170h85M260 170h110"/>
  <path class="wire" d="M370 170h150v-45M520 170h105M625 170h130"/>
  <path class="wire" d="M110 170v150M370 170v150M520 170v150M755 170v150"/>
  <path class="wire" d="M110 320h645"/>

