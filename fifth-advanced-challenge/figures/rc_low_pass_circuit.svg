  <circle cx="260" cy="170" r="5" fill="#15312d"/>
  <circle cx="370" cy="170" r="5" fill="#15312d"/>
  <circle cx="520" cy="170" r="5" fill="#d7643c"/>
  <circle cx="625" cy="170" r="5" fill="#08736c"/>

  <g transform="translate(175 170)">
