<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLUE SNAKE · 蓝色贪吃蛇</title>
<style>
  /* ===== 主题变量：默认深色，body[data-theme="light"] 切浅色 ===== */
  :root {
    --page-bg: radial-gradient(ellipse at 50% -20%, #123a6e 0%, #0a1e3f 45%, #050d1f 100%);
    --text: #dbe9ff; --text-dim: #7ea6d8; --label: #6f97c9; --tips: #5d82b4;
    --accent: #8fd0ff; --accent-2: #4a9eff; --gold: #ffd27a;
    --value-glow: rgba(78,158,255,.55);
    --panel-bg: linear-gradient(160deg, rgba(70,130,220,.35), rgba(30,60,130,.15));
    --panel-ring: rgba(110,170,255,.28); --panel-glow: rgba(40,110,220,.28);
    --panel-shadow: rgba(0,10,30,.6);
    --canvas-bg: #071428;
    --card-bg: rgba(9,23,46,.97); --card-shadow: rgba(0,8,24,.7);
    --overlay-bg: rgba(5,13,31,.85);
    --chip-bg: rgba(30,70,140,.4); --chip-border: rgba(100,160,255,.4); --chip-text: #9cc6ff;
    --btn-bg: rgba(40,90,170,.5); --btn-border: rgba(110,170,255,.4);
    --btn-text: #cfe6ff; --btn-hover: rgba(60,120,210,.65);
    --title-grad: linear-gradient(90deg, #4a9eff, #8fd0ff, #4a9eff);
    --row-line: rgba(100,160,255,.18);
  }
  body[data-theme="light"] {
    --page-bg: radial-gradient(ellipse at 50% -20%, #ffffff 0%, #ecf4ff 45%, #dce9fb 100%);
    --text: #11335a; --text-dim: #47709e; --label: #6b93bf; --tips: #5f7f9f;
    --accent: #2E7CC9; --accent-2: #2E7CC9; --gold: #b9800c;
    --value-glow: rgba(46,124,201,.28);
    --panel-bg: linear-gradient(160deg, rgba(255,255,255,.95), rgba(224,238,255,.8));
    --panel-ring: rgba(46,124,201,.35); --panel-glow: rgba(90,160,240,.4);
    --panel-shadow: rgba(40,90,150,.2);
    --canvas-bg: #f2f8ff;
    --card-bg: rgba(255,255,255,.98); --card-shadow: rgba(40,90,150,.3);
    --overlay-bg: rgba(240,247,255,.92);
    --chip-bg: rgba(46,124,201,.10); --chip-border: rgba(46,124,201,.38); --chip-text: #2E7CC9;
    --btn-bg: rgba(46,124,201,.10); --btn-border: rgba(46,124,201,.38);
    --btn-text: #245f9e; --btn-hover: rgba(46,124,201,.22);
    --title-grad: linear-gradient(90deg, #2E7CC9, #79b4ea, #2E7CC9);
    --row-line: rgba(46,124,201,.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--page-bg);
    color: var(--text);
    transition: background .35s ease, color .35s ease;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(140,200,255,.35) 50%, transparent 100%),
      radial-gradient(1px 1px at 70% 60%, rgba(120,180,255,.30) 50%, transparent 100%),
      radial-gradient(2px 2px at 40% 80%, rgba(100,160,255,.25) 50%, transparent 100%),
      radial-gradient(1px 1px at 85% 20%, rgba(160,210,255,.30) 50%, transparent 100%);
    transition: opacity .35s ease;
  }
  body[data-theme="light"]::before { opacity: 0; }

  .wrap {
    position: relative; z-index: 1;
    min-height: 100vh; margin: 0 auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 13px;
    padding: 18px;
  }

  h1 {
    font-size: 24px; font-weight: 800; letter-spacing: 9px; text-indent: 9px;
    background: var(--title-grad);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    animation: shimmer 4s linear infinite;
  }
  @keyframes shimmer { to { background-position: 200% 0; } }

  .hud { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat .label { font-size: 10px; letter-spacing: 3px; color: var(--label); }
  .stat .value {
    font-size: 24px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums;
    text-shadow: 0 0 18px var(--value-glow); display: inline-block;
  }
  .stat .value.best { color: var(--gold); text-shadow: 0 0 18px rgba(255,200,100,.35); }
  .stat.right { text-align: right; }
  @keyframes pop { 0% { transform: scale(1); } 32% { transform: scale(1.5); } 100% { transform: scale(1); } }
  .value.pop { animation: pop .4s cubic-bezier(.2,1.6,.4,1); }

  .mid { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .speed-tag, .ai-tag {
    font-size: 11px; letter-spacing: 2px; padding: 5px 14px; border-radius: 999px;
    border: 1px solid var(--chip-border); background: var(--chip-bg);
    color: var(--chip-text); user-select: none; white-space: nowrap; transition: all .25s;
  }
  .speed-tag.up { color: #ffb94d; border-color: rgba(255,200,110,.8); }
  .combo-tag { font-size: 10px; letter-spacing: 2px; color: #e8a93a; opacity: 0; transition: opacity .25s; white-space: nowrap; }
  .combo-tag.on { opacity: 1; }

  .board-frame {
    position: relative; padding: 10px; border-radius: 22px;
    background: var(--panel-bg);
    box-shadow:
      0 0 0 1px var(--panel-ring),
      0 0 60px var(--panel-glow),
      0 30px 70px var(--panel-shadow);
    will-change: transform;
    transition: background .35s ease, box-shadow .35s ease;
  }
  canvas { display: block; border-radius: 14px; background: var(--canvas-bg); transition: background .35s ease; }

  .overlay {
    position: absolute; inset: 10px; border-radius: 14px;
    background: var(--overlay-bg); backdrop-filter: blur(6px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay .big {
    font-size: 30px; font-weight: 800; letter-spacing: 5px; color: var(--accent);
    text-shadow: 0 0 30px var(--value-glow);
  }
  .overlay .sub { font-size: 13px; color: var(--text-dim); letter-spacing: 1px; line-height: 1.8; }

  button {
    padding: 9px 20px; font-size: 12px; font-weight: 700; letter-spacing: 2px;
    color: var(--btn-text); background: var(--btn-bg);
    border: 1px solid var(--btn-border); border-radius: 999px; cursor: pointer;
    transition: all .15s; font-family: inherit;
  }
  button:hover { background: var(--btn-hover); color: var(--accent); }
  .overlay button {
    margin-top: 4px; padding: 12px 42px; font-size: 15px; letter-spacing: 4px; text-indent: 4px;
    background: linear-gradient(135deg, #2E7CC9, #4a9eff); color: #fff; border: none;
    box-shadow: 0 0 24px rgba(74,158,255,.5), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .overlay button:hover { transform: translateY(-2px) scale(1.03); color: #fff; }

  .tips { font-size: 11px; letter-spacing: 1.5px; color: var(--tips); display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
  .tips b { color: var(--text-dim); }

  /* 控制条 + 数据条 */
  .controls { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; justify-content: center; }
  .controls button { padding: 9px 18px; font-size: 12px; letter-spacing: 2px; text-indent: 2px; }
  .controls button.on {
    background: linear-gradient(135deg, #2E7CC9, #4a9eff);
    color: #fff; border-color: transparent;
    box-shadow: 0 0 20px rgba(74,158,255,.55);
  }
  .controls button.danger-on { background: rgba(200,60,80,.75); color: #fff; border-color: transparent; }

  .stats-bar {
    display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
    font-size: 11px; letter-spacing: 1.5px; color: var(--label);
  }
  .stats-bar b { color: var(--accent); font-weight: 700; }
  .stats-bar .sep { opacity: .45; }

  .cert {
    font-size: 10px; letter-spacing: 1.5px; padding: 5px 13px; border-radius: 999px;
    border: 1px dashed var(--chip-border); color: var(--tips); transition: all .3s;
  }
  .cert.done {
    color: #ffd76a; border-style: solid; border-color: rgba(255,200,110,.75);
    box-shadow: 0 0 16px rgba(255,200,110,.3);
  }

  .dpad { display: none; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 8px; }
  .dpad button { margin: 0; padding: 0; width: 56px; height: 56px; font-size: 19px; letter-spacing: 0; border-radius: 16px; }
  .dpad .blank { visibility: hidden; }
  @media (hover: none) and (pointer: coarse) { .dpad { display: grid; } }

  /* 战绩弹窗 */
  .modal {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(3,9,22,.6); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .modal.show { opacity: 1; pointer-events: auto; }
  .modal .card {
    width: min(370px, 88vw); max-height: 72vh; overflow: auto;
    border-radius: 18px; padding: 18px;
    background: var(--card-bg); color: var(--text);
    border: 1px solid var(--panel-ring);
    box-shadow: 0 24px 70px var(--card-shadow);
  }
  .modal h2 {
    font-size: 14px; letter-spacing: 4px; font-weight: 700; color: var(--accent);
    margin-bottom: 12px; text-align: center;
  }
  .rec-row {
    display: flex; align-items: center; gap: 10px;
    font-size: 12px; padding: 7px 2px; border-bottom: 1px dashed var(--row-line);
    font-variant-numeric: tabular-nums;
  }
  .rec-row .idx { width: 34px; color: var(--label); font-size: 11px; }
  .rec-row .sc { flex: 1; font-weight: 700; color: var(--accent); }
  .rec-row .who { font-size: 10px; letter-spacing: 1px; padding: 2px 8px; border-radius: 999px;
    background: var(--chip-bg); border: 1px solid var(--chip-border); color: var(--chip-text); }
  .rec-row .who.ai { color: #c9a2ff; border-color: rgba(180,140,255,.45); }
  .rec-row .tm { font-size: 10px; color: var(--label); }
  .rec-row.top .sc { color: var(--gold); }
  .rec-empty { font-size: 12px; color: var(--tips); text-align: center; padding: 26px 0; letter-spacing: 1px; }
  .modal .close-wrap { display: flex; justify-content: center; margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>BLUE SNAKE</h1>

  <div class="hud">
    <div class="stat">
      <span class="label">分数 SCORE</span>
      <span class="value" id="score">0</span>
    </div>
    <div class="mid">
      <span class="speed-tag" id="speedTag">SPEED 1</span>
      <span class="combo-tag" id="comboTag">连击 x2</span>
    </div>
    <div class="stat right">
      <span class="label">最高 BEST</span>
      <span class="value best" id="best">0</span>
    </div>
  </div>

  <div class="board-frame" id="frame">
    <canvas id="game" width="480" height="480"></canvas>
    <div class="overlay show" id="overlay">
      <div class="big" id="ovTitle">蓝色贪吃蛇</div>
      <div class="sub" id="ovSub">方向键 / WASD 控制 · 空格暂停 · 吃掉水果<br>不想玩就点下面的「AI 托管」看它表演</div>
      <button id="ovBtn">开 始</button>
    </div>
  </div>

  <div class="controls">
    <button id="aiBtn">AI 托管</button>
    <button id="themeBtn">主题：浅色</button>
    <button id="recBtn">战绩</button>
    <button id="resetBtn">重置统计</button>
  </div>

  <div class="controls">
    <span class="ai-tag slim" id="aiTag">AI 待机 · 按方向键随时接管</span>
    <span class="cert" id="certTag">阶段二指标：AI 连吃 0/15</span>
  </div>

  <div class="stats-bar">
    <span>第 <b id="roundNo">1</b> 局</span>
    <span class="sep">|</span>
    <span>累计局数 <b id="roundsTotal">0</b></span>
    <span class="sep">|</span>
    <span>你的最高分 <b id="bestHuman">0</b></span>
    <span class="sep">|</span>
    <span>AI 最高分 <b id="bestAi">0</b></span>
  </div>

  <div class="tips">
    <span><b>↑↓←→ / WASD</b> 移动</span>
    <span><b>空格</b> 暂停</span>
    <span><b>R</b> 重开</span>
    <span><b>方向键</b> 夺回控制权</span>
  </div>

  <div class="dpad">
    <span class="blank"></span>
    <button data-dir="up">▲</button>
    <span class="blank"></span>
    <button data-dir="left">◀</button>
    <button data-dir="down">▼</button>
    <button data-dir="right">▶</button>
  </div>
</div>

<!-- 战绩弹窗 -->
<div class="modal" id="modal">
  <div class="card">
    <h2>最近战绩</h2>
    <div id="recList"></div>
    <div class="close-wrap"><button id="recClose">关 闭</button></div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const frame  = document.getElementById('frame');
  const GRID = 24;
  const CELL = canvas.width / GRID;

  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');
  const speedEl = document.getElementById('speedTag');
  const comboTag= document.getElementById('comboTag');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovSub   = document.getElementById('ovSub');
  const ovBtn   = document.getElementById('ovBtn');
  const aiBtn   = document.getElementById('aiBtn');
  const aiTag   = document.getElementById('aiTag');
  const themeBtn= document.getElementById('themeBtn');
  const recBtn  = document.getElementById('recBtn');
  const resetBtn= document.getElementById('resetBtn');
  const recList = document.getElementById('recList');
  const recClose= document.getElementById('recClose');
  const modal   = document.getElementById('modal');
  const certTag = document.getElementById('certTag');
  const roundNoEl   = document.getElementById('roundNo');
  const roundsTotalEl = document.getElementById('roundsTotal');
  const bestHumanEl = document.getElementById('bestHuman');
  const bestAiEl    = document.getElementById('bestAi');

  let snake, dir, queue, food, score, best, eaten;
  let running, paused, dead;
  let lastTime = 0, acc = 0, growPulse = 0;
  let lastEatAt = 0, combo = 0;
  let aiOn = false, aiPlan = [], aiMode = 'hunt', aiHunger = 0, aiRestartTimer = 0;
  let aiStreak = 0;           // AI 本局连续吃到水果数（任务书阶段二硬指标）
  let theme = 'dark';

  /* ==================== 计分制 / 多局战绩（localStorage 持久化） ==================== */

  const LS_KEY = 'blueSnakeStats';

  let stats = { rounds: 0, bestHuman: 0, bestAi: 0, certified: false, records: [] };

  function loadStats() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        stats = {
          rounds: s.rounds | 0,
          bestHuman: s.bestHuman | 0,
          bestAi: s.bestAi | 0,
          certified: !!s.certified,
          records: Array.isArray(s.records) ? s.records.slice(0, 50) : [],
        };
      } else {
        // 兼容旧版只存最高分的记录
        stats.bestHuman = +(localStorage.getItem('blueSnakeBest') || 0);
      }
    } catch (e) { /* 数据损坏就重来，不让游戏打不开 */ }
  }
  function saveStats() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(stats)); } catch (e) {}
  }

  // 记一局战绩（新一局自动追加，最多留最近 50 局）
  function recordRound(sc, isAi) {
    stats.rounds++;
    if (isAi) stats.bestAi = Math.max(stats.bestAi, sc);
    else stats.bestHuman = Math.max(stats.bestHuman, sc);
    const d = new Date();
    stats.records.unshift({
      score: sc,
      ai: isAi,
      time: ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2),
    });
    if (stats.records.length > 50) stats.records.length = 50;
    saveStats();
    paintStats();
  }

  function paintStats() {
    roundNoEl.textContent = stats.rounds + 1;
    roundsTotalEl.textContent = stats.rounds;
    bestHumanEl.textContent = stats.bestHuman;
    bestAiEl.textContent = stats.bestAi;
    best = stats.bestHuman;                 // 界面「最高」显示的是她自己的纪录
    bestEl.textContent = best;
    certTag.className = stats.certified ? 'cert done' : 'cert';
    certTag.textContent = stats.certified
      ? '✓ 阶段二指标已达成：AI 连吃 15 个（本局 ' + aiStreak + '）'
      : '阶段二指标：AI 连吃 ' + Math.min(aiStreak, 15) + '/15';
  }

  function renderRecords() {
    if (!stats.records.length) {
      recList.innerHTML = '<div class="rec-empty">还没有战绩，先玩一局吧</div>';
      return;
    }
    const best = Math.max(...stats.records.map(r => r.score));
    recList.innerHTML = stats.records.map((r, i) =>
      `<div class="rec-row${r.score === best && i === 0 ? ' top' : ''}">` +
        `<span class="idx">#${stats.records.length - i}</span>` +
        `<span class="sc">${r.score} 分</span>` +
        `<span class="who${r.ai ? ' ai' : ''}">${r.ai ? 'AI' : '你'}</span>` +
        `<span class="tm">${r.time}</span>` +
      `</div>`
    ).join('');
  }

  /* ==================== 主题切换（深色 / 浅色，刷新后保留） ==================== */

  const CANVAS_THEME = {
    dark: {
      bg: ['#081a36', '#060f24'],
      grid: 'rgba(90,150,230,.10)',
      headGrad: ['#cfeeff', '#5aabf0', '#2E7CC9'],
      headGlow: '#4a9eff',
      bodyFrom: [62, 150, 235], bodyTo: [36, 95, 180], glowK: 46,
      eye: '#0a1e3f',
      tailRing: 'rgba(140,200,255,.4)',
      floatText: '#eaf6ff',
      haloA: 'rgba(110,190,255,.30)',
      haloGold: 'rgba(255,215,120,.42)',
      fruitGlow: 'rgba(130,200,255,.8)',
      fruitGlowGold: 'rgba(255,215,120,.95)',
      vignette: 'rgba(120,190,255,',
      flashA: 'rgba(150,205,255,', flashB: 'rgba(90,170,255,', flashC: 'rgba(255,230,150,',
      frameShadow: 'rgba(0,10,30,.6)',
    },
    light: {
      bg: ['#f3f9ff', '#dfeafb'],
      grid: 'rgba(70,120,190,.14)',
      headGrad: ['#ffffff', '#4a9eff', '#2E7CC9'],
      headGlow: '#2E7CC9',
      bodyFrom: [46, 124, 201], bodyTo: [24, 70, 133], glowK: 26,
      eye: '#ffffff',
      tailRing: 'rgba(46,124,201,.5)',
      floatText: '#0f3f6e',
      haloA: 'rgba(70,150,230,.22)',
      haloGold: 'rgba(240,180,40,.32)',
      fruitGlow: 'rgba(46,124,201,.75)',
      fruitGlowGold: 'rgba(230,160,20,.9)',
      vignette: 'rgba(90,160,240,',
      flashA: 'rgba(46,124,201,', flashB: 'rgba(46,124,201,', flashC: 'rgba(235,175,40,',
      frameShadow: 'rgba(40,90,150,.22)',
    },
  };

  function applyTheme(name, persist) {
    theme = name === 'light' ? 'light' : 'dark';
    document.body.dataset.theme = theme;
    themeBtn.textContent = theme === 'dark' ? '主题：浅色' : '主题：深色';
    if (persist !== false) { try { localStorage.setItem('blueSnakeTheme', theme); } catch (e) {} }
  }

  loadStats();
  applyTheme(localStorage.getItem('blueSnakeTheme') || 'dark', false);
  paintStats();


  /* ==================== 水果 ==================== */

  function leafOn(cx, cy, r, color) {
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(-0.6);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.ellipse(r * 0.62, 0, r * 0.62, r * 0.28, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function stemOn(cx, cy, r, color) {
    ctx.strokeStyle = color; ctx.lineWidth = Math.max(1.4, r * 0.16); ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx, cy + r * 0.1);
    ctx.quadraticCurveTo(cx + r * 0.12, cy - r * 0.6, cx + r * 0.22, cy - r * 0.95);
    ctx.stroke();
  }
  function bodyGrad(cx, cy, r, light, main, deep) {
    const g = ctx.createRadialGradient(cx - r * 0.4, cy - r * 0.45, r * 0.1, cx, cy, r * 1.25);
    g.addColorStop(0, light); g.addColorStop(0.42, main); g.addColorStop(1, deep);
    return g;
  }

  function drawApple(cx, cy, r, F) {
    ctx.fillStyle = bodyGrad(cx, cy, r, '#ffe0e3', F.main, F.deep);
    ctx.beginPath();
    ctx.moveTo(cx, cy - r * 0.5);
    ctx.bezierCurveTo(cx + r * 0.3, cy - r * 1.1, cx + r * 1.2, cy - r * 0.85, cx + r * 1.1, cy + r * 0.15);
    ctx.bezierCurveTo(cx + r * 1.02, cy + r * 1.05, cx + r * 0.42, cy + r * 1.15, cx, cy + r * 1.15);
    ctx.bezierCurveTo(cx - r * 0.42, cy + r * 1.15, cx - r * 1.02, cy + r * 1.05, cx - r * 1.1, cy + r * 0.15);
    ctx.bezierCurveTo(cx - r * 1.2, cy - r * 0.85, cx - r * 0.3, cy - r * 1.1, cx, cy - r * 0.5);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.ellipse(cx - r * 0.42, cy - r * 0.34, r * 0.24, r * 0.36, -0.5, 0, Math.PI * 2); ctx.fill();
    stemOn(cx, cy - r * 0.55, r, '#8a5a2b');
    leafOn(cx + r * 0.05, cy - r * 0.95, r, F.leaf);
  }
  function drawOrange(cx, cy, r, F) {
    ctx.fillStyle = bodyGrad(cx, cy, r, '#ffe1a8', F.main, F.deep);
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(190,90,0,.32)'; ctx.lineWidth = Math.max(1, r * 0.09);
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.quadraticCurveTo(cx + Math.cos(a - 0.25) * r * 0.55, cy + Math.sin(a - 0.25) * r * 0.55,
                           cx + Math.cos(a) * r * 0.92, cy + Math.sin(a) * r * 0.92);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.beginPath(); ctx.ellipse(cx - r * 0.38, cy - r * 0.4, r * 0.22, r * 0.3, -0.5, 0, Math.PI * 2); ctx.fill();
    leafOn(cx + r * 0.16, cy - r * 0.9, r * 0.9, F.leaf);
  }
  function drawBlueberry(cx, cy, r, F) {
    const berries = [[0, 0, 1], [-0.62, 0.42, 0.66], [0.6, 0.4, 0.62]];
    for (const [ox, oy, s] of berries) {
      const bx = cx + ox * r * 0.85, by = cy + oy * r * 0.85, br = r * s * 0.82;
      ctx.fillStyle = bodyGrad(bx, by, br, '#cfe4ff', F.main, F.deep);
      ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.beginPath(); ctx.ellipse(bx - br * 0.32, by - br * 0.35, br * 0.24, br * 0.18, -0.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(20,50,110,.65)';
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a = -Math.PI / 2 + i * (Math.PI * 2 / 5);
        const px = bx + Math.cos(a) * br * 0.42, py = by + Math.sin(a) * br * 0.42;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill();
    }
  }
  function drawGrape(cx, cy, r, F) {
    const pts = [[0,0.55,0.62],[-0.5,0.16,0.58],[0.5,0.16,0.58],[-0.26,-0.32,0.56],[0.26,-0.32,0.56],[0,-0.05,0.6],[0,-0.72,0.54]];
    for (const [ox, oy, s] of pts) {
      const bx = cx + ox * r * 0.92, by = cy + oy * r * 0.92, br = r * s * 0.82;
      ctx.fillStyle = bodyGrad(bx, by, br, '#e6d4ff', F.main, F.deep);
      ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.42)';
      ctx.beginPath(); ctx.arc(bx - br * 0.3, by - br * 0.32, br * 0.2, 0, Math.PI * 2); ctx.fill();
    }
    stemOn(cx, cy - r * 0.85, r * 0.7, '#7aa05a');
  }
  function drawLemon(cx, cy, r, F) {
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(-0.42);
    ctx.fillStyle = bodyGrad(0, 0, r, '#fff6c2', F.main, F.deep);
    ctx.beginPath(); ctx.ellipse(0, 0, r * 1.18, r * 0.86, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = F.deep;
    ctx.beginPath(); ctx.ellipse(r * 1.2, 0, r * 0.16, r * 0.12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-r * 1.2, 0, r * 0.16, r * 0.12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.ellipse(-r * 0.3, -r * 0.34, r * 0.42, r * 0.18, -0.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    leafOn(cx + r * 0.35, cy - r * 0.85, r * 0.8, F.leaf);
  }
  function drawStrawberry(cx, cy, r, F) {
    ctx.fillStyle = bodyGrad(cx, cy - r * 0.1, r, '#ffd2d8', F.main, F.deep);
    ctx.beginPath();
    ctx.moveTo(cx - r * 0.95, cy - r * 0.35);
    ctx.bezierCurveTo(cx - r * 1.05, cy + r * 0.5, cx - r * 0.35, cy + r * 1.15, cx, cy + r * 1.25);
    ctx.bezierCurveTo(cx + r * 0.35, cy + r * 1.15, cx + r * 1.05, cy + r * 0.5, cx + r * 0.95, cy - r * 0.35);
    ctx.bezierCurveTo(cx + r * 0.6, cy - r * 0.75, cx - r * 0.6, cy - r * 0.75, cx - r * 0.95, cy - r * 0.35);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,240,170,.9)';
    for (const [sx, sy] of [[-0.45,-0.05],[-0.1,-0.2],[0.3,-0.05],[0.5,0.35],[-0.28,0.4],[0.05,0.75],[-0.5,0.35],[0.15,0.25]]) {
      ctx.beginPath(); ctx.ellipse(cx + sx * r, cy + sy * r, r * 0.09, r * 0.13, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = F.leaf;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(cx, cy - r * 0.42);
      ctx.lineTo(cx + i * r * 0.62, cy - r * 0.92 + Math.abs(i) * r * 0.2);
      ctx.lineTo(cx + i * r * 0.22, cy - r * 0.5);
      ctx.closePath(); ctx.fill();
    }
    stemOn(cx, cy - r * 0.6, r * 0.7, '#7aa05a');
  }
  function drawGolden(cx, cy, r, F) {
    const g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.35, r * 0.1, cx, cy, r * 1.3);
    g.addColorStop(0, '#fff9dd'); g.addColorStop(0.45, F.main); g.addColorStop(1, F.deep);
    ctx.fillStyle = g;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rad = i % 2 === 0 ? r * 1.22 : r * 0.55;
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const px = cx + Math.cos(a) * rad, py = cy + Math.sin(a) * rad;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.beginPath(); ctx.arc(cx - r * 0.22, cy - r * 0.25, r * 0.18, 0, Math.PI * 2); ctx.fill();
  }

  const COMMON = [
    { name: '苹果', main: '#ff5f6d', deep: '#c81f3c', leaf: '#4fd18b', points: 1, draw: drawApple },
    { name: '橙子', main: '#ffb347', deep: '#e8760f', leaf: '#4fd18b', points: 1, draw: drawOrange },
    { name: '蓝莓', main: '#6ea8ff', deep: '#2E7CC9', leaf: '#4fd18b', points: 1, draw: drawBlueberry },
    { name: '葡萄', main: '#b98cff', deep: '#7541d4', leaf: '#4fd18b', points: 1, draw: drawGrape },
    { name: '柠檬', main: '#ffe066', deep: '#d9b41f', leaf: '#4fd18b', points: 1, draw: drawLemon },
    { name: '草莓', main: '#ff7a8a', deep: '#d62844', leaf: '#4fd18b', points: 1, draw: drawStrawberry },
  ];
  const GOLD = { name: '金果', main: '#ffd76a', deep: '#e09b12', leaf: '#ffe9a8', points: 3, gold: true, draw: drawGolden };

  /* ==================== 奖励特效 ==================== */

  const particles = [], rings = [], texts = [];
  let shakeAmp = 0, flashAmp = 0, tiltAmp = 0;

  // 飘字颜色跟着主题走（浅色底上不能用浅色字）
  const fxText = () => theme === 'light' ? '#0f3f6e' : '#eaf6ff';
  const fxGold = () => theme === 'light' ? '#b9800c' : '#ffe9a8';

  function burst(cellX, cellY, fruit) {
    const cx = cellX * CELL + CELL/2, cy = cellY * CELL + CELL/2;
    const gold = !!fruit.gold;
    const n = gold ? 40 : 20;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = (gold ? 4.6 : 3.2) * (0.35 + Math.random());
      particles.push({
        x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.1,
        life: 1, decay: 0.016 + Math.random() * 0.014,
        r: (gold ? 3.6 : 2.6) * (0.6 + Math.random() * 0.8),
        color: Math.random() < 0.28 ? '#ffffff' : fruit.main,
      });
    }
    rings.push({ x: cx, y: cy, r: CELL * 0.3, max: gold ? CELL * 4.6 : CELL * 3.2, life: 1, color: fruit.main, w: gold ? 3.4 : 2.4 });
    if (gold) rings.push({ x: cx, y: cy, r: CELL * 0.2, max: CELL * 3, life: 1, color: '#fff3c4', w: 2 });

    texts.push({
      x: cx, y: cy, vy: -0.9,
      text: '+' + fruit.points + ' ' + fruit.name,
      life: 1, color: gold ? fxGold() : fxText(), size: gold ? 19 : 15,
    });
    if (combo >= 2) {
      texts.push({ x: cx, y: cy - CELL * 1.4, vy: -0.85, text: '连击 x' + combo, life: 1, color: fxGold(), size: 14 });
    }

    shakeAmp = Math.max(shakeAmp, gold ? 17 : 8.5 + Math.min(combo, 4) * 1.6);
    tiltAmp  = Math.max(tiltAmp,  gold ? 0.28 : 0.14);
    flashAmp = Math.max(flashAmp, gold ? 0.85 : 0.42);

    scoreEl.classList.remove('pop');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('pop');

    if (navigator.vibrate) { try { navigator.vibrate(gold ? [16, 26, 16] : 12); } catch (e) {} }
  }

  function updateFX() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += 0.16; p.vx *= 0.975; p.vy *= 0.985;
      p.x += p.vx; p.y += p.vy; p.life -= p.decay;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i];
      r.r += (r.max - r.r) * 0.16; r.life -= 0.045;
      if (r.life <= 0) rings.splice(i, 1);
    }
    for (let i = texts.length - 1; i >= 0; i--) {
      const tx = texts[i];
      tx.y += tx.vy; tx.vy *= 0.97; tx.life -= 0.017;
      if (tx.life <= 0) texts.splice(i, 1);
    }
    if (shakeAmp > 0.2) {
      const a = shakeAmp;
      const dx = (Math.random() - 0.5) * a * 2;
      const dy = (Math.random() - 0.5) * a * 2;
      const rot = (Math.random() - 0.5) * tiltAmp;
      const sc = 1 + a * 0.0022;
      frame.style.transform = `translate(${dx.toFixed(2)}px, ${dy.toFixed(2)}px) rotate(${rot.toFixed(3)}deg) scale(${sc.toFixed(4)})`;
      shakeAmp *= 0.85; tiltAmp *= 0.85;
    } else if (shakeAmp !== 0) {
      shakeAmp = 0; tiltAmp = 0; frame.style.transform = '';
    }
    if (flashAmp > 0.01) {
      const f = flashAmp;
      const T = CANVAS_THEME[theme];
      frame.style.boxShadow =
        `0 0 0 1px ${T.flashA}${(0.28 + f * 0.7).toFixed(2)}),` +
        `0 0 ${(40 + f * 150).toFixed(0)}px ${T.flashB}${(0.3 + f * 0.7).toFixed(2)}),` +
        `0 0 ${(20 + f * 90).toFixed(0)}px ${T.flashC}${(f * 0.5).toFixed(2)}),` +
        `0 30px 70px ${T.frameShadow}`;
      flashAmp *= 0.88;
    } else if (flashAmp !== 0) {
      flashAmp = 0; frame.style.boxShadow = '';
    }
  }

  function drawFX() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const r of rings) {
      ctx.strokeStyle = r.color;
      ctx.globalAlpha = Math.max(0, r.life) * 0.75;
      ctx.lineWidth = r.w * r.life;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
    }
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.textAlign = 'center';
    for (const t of texts) {
      ctx.globalAlpha = Math.max(0, Math.min(1, t.life * 1.6));
      ctx.font = `bold ${t.size}px "Segoe UI", "PingFang SC", sans-serif`;
      ctx.fillStyle = t.color;
      ctx.shadowColor = 'rgba(120,190,255,.95)';
      ctx.shadowBlur = 12;
      ctx.fillText(t.text, t.x, t.y);
    }
    ctx.restore();
  }

  /* ==================== AI 大脑（AI 托管模式） ==================== */

  const K = (x, y) => y * GRID + x;
  const cellOf = k => ({ x: k % GRID, y: Math.floor(k / GRID) });
  const inside = (x, y) => x >= 0 && y >= 0 && x < GRID && y < GRID;
  const DIRS = [[0, -1], [0, 1], [-1, 0], [1, 0]];

  // 从蛇头 BFS 到 target，返回不含起点的路径
  function bfsPath(snakes, target, blocked) {
    const start = snakes[0], sk = K(start.x, start.y);
    const prev = new Map(), seen = new Set([sk]), q = [start];
    let h = 0;
    while (h < q.length) {
      const cur = q[h++];
      if (cur.x === target.x && cur.y === target.y) {
        const path = []; let k = K(cur.x, cur.y);
        while (k !== sk) { path.push(cellOf(k)); k = prev.get(k); }
        return path.reverse();
      }
      for (const [dx, dy] of DIRS) {
        const nx = cur.x + dx, ny = cur.y + dy;
        if (!inside(nx, ny)) continue;
        const nk = K(nx, ny);
        if (seen.has(nk) || blocked.has(nk)) continue;
        seen.add(nk); prev.set(nk, K(cur.x, cur.y)); q.push({ x: nx, y: ny });
      }
    }
    return null;
  }

  // 从某点能到达的自由格数量
  function floodArea(from, blocked) {
    if (blocked.has(K(from.x, from.y))) return 0;
    const seen = new Set([K(from.x, from.y)]), q = [from];
    let h = 0, count = 0;
    while (h < q.length) {
      const cur = q[h++]; count++;
      for (const [dx, dy] of DIRS) {
        const nx = cur.x + dx, ny = cur.y + dy;
        if (!inside(nx, ny)) continue;
        const nk = K(nx, ny);
        if (seen.has(nk) || blocked.has(nk)) continue;
        seen.add(nk); q.push({ x: nx, y: ny });
      }
    }
    return count;
  }

  // 蛇身占格（尾巴即将腾出 → 可当通行）
  function bodySet(snakes, excludeTail) {
    const s = new Set();
    for (let i = 0; i < snakes.length; i++) {
      if (excludeTail && i === snakes.length - 1) continue;
      s.add(K(snakes[i].x, snakes[i].y));
    }
    return s;
  }
  function blockedFor(snakes, head) {
    const b = bodySet(snakes, true);
    b.delete(K(head.x, head.y));
    return b;
  }
  // 走完这一步后，头还能摸到尾巴？（有退路 = 安全）
  function safeAfterMove(snakes, move) {
    const ns = [move, ...snakes]; ns.pop();
    const b = bodySet(ns, true);
    b.delete(K(move.x, move.y));
    return !!bfsPath(ns, ns[ns.length - 1], b);
  }
  // 走完这一步后，剩余可活动空间
  function roomAfter(snakes, move) {
    const ns = [move, ...snakes]; ns.pop();
    const b = bodySet(ns, true);
    b.delete(K(move.x, move.y));
    return floodArea(move, b);
  }
  // 虚拟蛇沿整条路径走一遍，返回「安全前缀」
  function safePrefix(snakes, path) {
    let sim = snakes.slice();
    const safe = [];
    for (const st of path) {
      if (!safeAfterMove(sim, st)) break;
      const grew = (st.x === food.x && st.y === food.y);
      sim = [st, ...sim];
      if (!grew) sim.pop();
      safe.push(st);
      if (grew) break;
    }
    return safe;
  }

  // 决策：返回下一步的格子
  function aiThink() {
    const head = snake[0];

    // 1) 追水果
    const pf = bfsPath(snake, food, blockedFor(snake, head));
    if (pf && pf.length) {
      const safe = safePrefix(snake, pf);
      if (safe.length) { aiMode = 'hunt'; aiPlan = pf; return safe[0]; }
      // 水果就在眼前 / 饿太久 → 冒险抄近道，打破绕圈
      if ((pf.length <= 3 || aiHunger > 30) && roomAfter(snake, pf[0]) >= snake.length) {
        aiMode = 'risk'; aiPlan = pf; return pf[0];
      }
    }

    // 2) 求生：候选格按「有退路 > 空间大 > 靠近水果」排序
    aiMode = 'survive';
    const ball = bodySet(snake, false);
    const cands = [];
    for (const [dx, dy] of DIRS) {
      const nx = head.x + dx, ny = head.y + dy;
      if (!inside(nx, ny)) continue;
      if (dx === -dir.x && dy === -dir.y) continue;
      if (ball.has(K(nx, ny))) continue;
      const mv = { x: nx, y: ny };
      cands.push({
        move: mv,
        isSafe: safeAfterMove(snake, mv) ? 1 : 0,
        room: roomAfter(snake, mv),
        dist: Math.abs(nx - food.x) + Math.abs(ny - food.y),
      });
    }
    cands.sort((a, b) => (b.isSafe - a.isSafe) || (b.room - a.room) || (a.dist - b.dist));
    if (cands.length) { aiPlan = [cands[0].move]; return cands[0].move; }
    return null;
  }

  function paintAiTag() {
    if (!aiOn) {
      aiTag.className = 'ai-tag slim';
      aiTag.textContent = 'AI 待机 · 按方向键随时接管';
      return;
    }
    const streak = aiStreak >= 15 ? ' · 已连吃 ' + aiStreak + ' 个 ✓' : ' · 连吃 ' + aiStreak;
    if (aiMode === 'hunt') {
      aiTag.className = 'ai-tag thinking';
      aiTag.textContent = (aiPlan.length > 8 ? 'AI 托管 · 规划长路线（余 ' + aiPlan.length + ' 步）' : 'AI 托管 · 追踪水果') + streak;
    } else if (aiMode === 'risk') {
      aiTag.className = 'ai-tag thinking';
      aiTag.textContent = 'AI 托管 · 冒险抄近道' + streak;
    } else {
      aiTag.className = 'ai-tag warn';
      aiTag.textContent = 'AI 托管 · 求生盘绕中' + streak;
    }
  }

  /* ==================== 游戏逻辑 ==================== */

  function reset() {
    snake = [{x: 9, y: 11}, {x: 8, y: 11}, {x: 7, y: 11}];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0; eaten = 0;
    scoreEl.textContent = 0;
    speedEl.textContent = 'SPEED 1';
    speedEl.classList.remove('up');
    combo = 0; lastEatAt = 0;
    comboTag.classList.remove('on');
    dead = false; paused = false;
    lastTime = 0; acc = 0; growPulse = 0;
    aiPlan = []; aiHunger = 0; aiStreak = 0;
    particles.length = 0; rings.length = 0; texts.length = 0;
    shakeAmp = 0; flashAmp = 0; tiltAmp = 0;
    frame.style.transform = ''; frame.style.boxShadow = '';
    placeFood();
    paintAiTag();
    paintStats();
  }

  function placeFood() {
    do {
      food = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
    food.fruit = Math.random() < 0.12 ? GOLD : COMMON[Math.floor(Math.random() * COMMON.length)];
  }

  function level() { return Math.min(9, Math.floor(eaten / 5)); }
  function interval() { return Math.max(52, 150 - level() * 11); }

  function setDir(nx, ny) {
    if (aiOn) takeOver();                            // 按方向键 = 夺回控制权
    const last = queue.length ? queue[queue.length - 1] : dir;
    if (last.x === -nx && last.y === -ny) return;   // 不能 180° 掉头
    if (last.x === nx && last.y === ny) return;     // 重复方向忽略
    if (queue.length < 2) queue.push({ x: nx, y: ny });
  }

  function step(t) {
    if (aiOn) {
      const mv = aiThink();
      if (!mv) return gameOver('AI 无路可走');
      dir = { x: mv.x - snake[0].x, y: mv.y - snake[0].y };
    } else if (queue.length) {
      dir = queue.shift();
    }
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    const willGrow = (head.x === food.x && head.y === food.y);

    // 撞墙判定
    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) return gameOver();

    // 撞自己：尾格这一步会让开，不算撞（长身体时尾格不动，照常算）
    const occupied = willGrow ? snake : snake.slice(0, snake.length - 1);
    if (occupied.some(s => s.x === head.x && s.y === head.y)) return gameOver();

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      combo = (t - lastEatAt < 2600) ? combo + 1 : 1;
      lastEatAt = t;
      comboTag.textContent = '连击 x' + combo;
      comboTag.classList.toggle('on', combo >= 2);

      const before = level();
      score += food.fruit.points;
      eaten++;
      scoreEl.textContent = score;
      growPulse = 1;
      aiHunger = 0;
      if (aiOn) {
        // 阶段二硬指标：AI 连续吃满 15 个水果不死
        aiStreak++;
        if (aiStreak >= 15 && !stats.certified) {
          stats.certified = true;
          saveStats();
          texts.push({ x: canvas.width / 2, y: canvas.height * 0.34, vy: -0.55,
                       text: '✓ 达成 AI 连吃 15 个', life: 1, color: fxGold(), size: 20 });
          shakeAmp = Math.max(shakeAmp, 14);
          flashAmp = Math.max(flashAmp, 0.7);
          rings.push({ x: canvas.width/2, y: canvas.height/2, r: 20, max: 340, life: 1, color: '#ffd76a', w: 3 });
        }
      }
      burst(head.x, head.y, food.fruit);
      placeFood();
      if (aiOn) paintAiTag();
      paintStats();

      if (level() > before) {
        speedEl.textContent = 'SPEED ' + (level() + 1);
        speedEl.classList.add('up');
        setTimeout(() => speedEl.classList.remove('up'), 700);
        texts.push({ x: canvas.width/2, y: canvas.height/2, vy: -0.7, text: '⚡ 提速 LV.' + (level() + 1),
                     life: 1, color: fxGold(), size: 22 });
        shakeAmp = Math.max(shakeAmp, 10);
        flashAmp = Math.max(flashAmp, 0.5);
      }
    } else {
      snake.pop();
      aiHunger++;
    }

    // 僵局保护：AI 太久吃不到东西 → 认输重开，避免画面一直盘绕
    if (aiOn && aiHunger > 700) return gameOver('AI 陷入僵局');
  }

  function gameOver(reason) {
    dead = true; running = false;
    clearTimeout(aiRestartTimer);

    // 记一局战绩：新一局自动追加，局数 / 最高分累加不清零
    recordRound(score, aiOn);

    const humanBest = stats.bestHuman;
    if (aiOn) {
      ovTitle.textContent = reason ? 'AI ' + reason.replace('AI ', '') : 'AI 阵亡';
      ovSub.innerHTML = `AI 本局 <b style="color:#8fd0ff">${score}</b> 分 · 连吃 ${aiStreak} 个` +
                        `<br>你的最高分仍是 ${humanBest} · 即将自动重开…`;
      aiRestartTimer = setTimeout(() => { if (aiOn) { reset(); running = true; overlay.classList.remove('show'); } }, 1700);
    } else if (score >= humanBest && score > 0) {
      ovTitle.textContent = '新纪录！';
      ovSub.innerHTML = `本局得分 <b style="color:#8fd0ff">${score}</b><br>这是你的第 ${stats.rounds} 局`;
    } else {
      ovTitle.textContent = '游戏结束';
      ovSub.innerHTML = `本局得分 <b style="color:#8fd0ff">${score}</b> · 你的最高 ${humanBest}`;
    }

    ovBtn.textContent = aiOn ? 'AI 重开' : '再来一局';
    overlay.classList.add('show');
    comboTag.classList.remove('on');
    // 死亡反馈
    shakeAmp = 22; tiltAmp = 0.5; flashAmp = 0.5;
    if (navigator.vibrate) { try { navigator.vibrate([30, 40, 60]); } catch (e) {} }
  }

  /* ==================== AI 托管开关 ==================== */

  function setAi(on) {
    aiOn = on;
    aiBtn.classList.toggle('on', aiOn);
    aiBtn.textContent = aiOn ? 'AI 托管中' : 'AI 托管';
    if (aiOn) {
      aiPlan = []; aiHunger = 0; aiMode = 'hunt';
      queue.length = 0;
      clearTimeout(aiRestartTimer);
      if (!running) { reset(); running = true; overlay.classList.remove('show'); }
      paintAiTag();
    } else {
      aiPlan = [];
      paintAiTag();
    }
  }

  // 玩家按方向键 → 立刻夺回控制权
  function takeOver() {
    if (!aiOn) return;
    setAi(false);
    texts.push({ x: canvas.width / 2, y: canvas.height * 0.28, vy: -0.8,
                 text: '你来！', life: 1, color: theme === 'light' ? '#2E7CC9' : '#9fe0ff', size: 20 });
    shakeAmp = Math.max(shakeAmp, 6);
  }

  /* ==================== 绘制 ==================== */

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw(t) {
    const T = CANVAS_THEME[theme];

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const bg = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    bg.addColorStop(0, T.bg[0]); bg.addColorStop(1, T.bg[1]);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = T.grid;
    for (let i = 0; i < GRID; i++)
      for (let j = 0; j < GRID; j++)
        ctx.fillRect(i*CELL + CELL/2 - 1, j*CELL + CELL/2 - 1, 2, 2);

    // AI 托管时的规划路径（虚线）
    if (aiOn && aiPlan.length) {
      const isSurvive = aiMode === 'survive';
      ctx.save();
      ctx.setLineDash([3, 5]);
      ctx.lineWidth = 2;
      ctx.strokeStyle = isSurvive ? 'rgba(230,160,40,.6)' : 'rgba(70,150,240,.55)';
      ctx.shadowColor = isSurvive ? 'rgba(230,160,40,.7)' : 'rgba(70,150,240,.7)';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(snake[0].x*CELL + CELL/2, snake[0].y*CELL + CELL/2);
      for (const p of aiPlan) ctx.lineTo(p.x*CELL + CELL/2, p.y*CELL + CELL/2);
      ctx.stroke();
      ctx.restore();
    }

    // 水果
    const F = food.fruit;
    const bob = Math.sin(t / 300) * 1.9;
    const fcx = food.x*CELL + CELL/2, fcy = food.y*CELL + CELL/2 + bob;
    const pulse = 0.94 + 0.06 * Math.sin(t / 200);
    const fr = CELL * 0.33 * pulse;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const halo = ctx.createRadialGradient(fcx, fcy, 0, fcx, fcy, CELL * 0.95);
    halo.addColorStop(0, F.gold ? T.haloGold : T.haloA);
    halo.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(fcx, fcy, CELL * 0.95, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    if (F.gold) {
      ctx.save();
      ctx.translate(fcx, fcy); ctx.rotate(t / 700);
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = theme === 'dark' ? 'rgba(255,225,150,.85)' : 'rgba(220,160,20,.85)';
      ctx.lineWidth = 1.6;
      for (let i = 0; i < 6; i++) {
        ctx.rotate(Math.PI / 3);
        ctx.beginPath(); ctx.moveTo(CELL * 0.62, 0); ctx.lineTo(CELL * 0.78, 0); ctx.stroke();
      }
      ctx.restore();
    }

    ctx.save();
    ctx.shadowColor = F.gold ? T.fruitGlowGold : T.fruitGlow;
    ctx.shadowBlur = F.gold ? 24 : 14;
    F.draw(fcx, fcy, fr, F);
    ctx.restore();

    // 蛇
    const n = snake.length;
    for (let i = n - 1; i >= 0; i--) {
      const s = snake[i];
      const x = s.x*CELL, y = s.y*CELL;
      const k = i / Math.max(n - 1, 1);
      const wave = 0.5 + 0.5 * Math.sin(t / 210 - i * 0.55);

      if (i === 0) {
        const scale = 1 + growPulse * 0.1;
        ctx.save();
        ctx.translate(x + CELL/2, y + CELL/2);
        ctx.scale(scale, scale);
        ctx.translate(-(x + CELL/2), -(y + CELL/2));
        ctx.shadowColor = T.headGlow; ctx.shadowBlur = 24;
        const hg = ctx.createLinearGradient(x, y, x + CELL, y + CELL);
        hg.addColorStop(0, T.headGrad[0]); hg.addColorStop(0.5, T.headGrad[1]); hg.addColorStop(1, T.headGrad[2]);
        ctx.fillStyle = hg;
        roundRect(x + 1, y + 1, CELL - 2, CELL - 2, 8);
        ctx.fill();
        ctx.restore();

        ctx.fillStyle = T.eye;
        const cx0 = x + CELL/2, cy0 = y + CELL/2;
        const off = CELL*0.16, side = CELL*0.15;
        const e1x = cx0 + dir.x*off + (dir.y !== 0 ? -side : 0);
        const e1y = cy0 + dir.y*off + (dir.x !== 0 ? -side : 0);
        const e2x = cx0 + dir.x*off + (dir.y !== 0 ?  side : 0);
        const e2y = cy0 + dir.y*off + (dir.x !== 0 ?  side : 0);
        ctx.beginPath(); ctx.arc(e1x, e1y, 2.2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(e2x, e2y, 2.2, 0, Math.PI*2); ctx.fill();
      } else {
        const glow = wave * T.glowK;
        const r = T.bodyFrom[0] + (T.bodyTo[0] - T.bodyFrom[0]) * k + glow;
        const g = T.bodyFrom[1] + (T.bodyTo[1] - T.bodyFrom[1]) * k + glow;
        const b = T.bodyFrom[2] + (T.bodyTo[2] - T.bodyFrom[2]) * k + glow * 0.6;
        ctx.save();
        if (i < 3) { ctx.shadowColor = T.fruitGlow; ctx.shadowBlur = 12; }
        ctx.fillStyle = `rgba(${Math.min(r|0,255)},${Math.min(g|0,255)},${Math.min(b|0,255)},${(0.96 - k*0.28).toFixed(2)})`;
        roundRect(x + 2, y + 2, CELL - 4, CELL - 4, 7);
        ctx.fill();
        ctx.restore();
      }
    }

    // 蛇尾锚点
    if (n > 1) {
      const tl = snake[n - 1];
      ctx.save();
      ctx.strokeStyle = T.tailRing;
      ctx.lineWidth = 1.4;
      roundRect(tl.x*CELL + 4, tl.y*CELL + 4, CELL - 8, CELL - 8, 5);
      ctx.stroke();
      ctx.restore();
    }

    drawFX();

    if (flashAmp > 0.02) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const vg = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.width*0.15,
                                          canvas.width/2, canvas.height/2, canvas.width*0.75);
      vg.addColorStop(0, T.vignette + (flashAmp*0.20).toFixed(3) + ')');
      vg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
    }

    if (growPulse > 0) growPulse = Math.max(0, growPulse - 0.07);
  }

  function loop(t) {
    requestAnimationFrame(loop);
    updateFX();
    if (!running || paused) { draw(t); return; }
    if (!lastTime) lastTime = t;
    acc += t - lastTime;
    lastTime = t;
    const iv = interval();
    let guard = 0;
    while (acc >= iv && guard++ < 4) {
      acc -= iv;
      step(t);
      if (!running) break;
    }
    if (acc > iv) acc = 0;
    draw(t);
  }

  /* ==================== 控制 ==================== */

  function start() {
    reset();
    running = true;
    overlay.classList.remove('show');
  }
  ovBtn.addEventListener('click', () => {
    if (paused) { paused = false; overlay.classList.remove('show'); return; }
    start();
  });

  document.addEventListener('keydown', e => {
    const key = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(key)) e.preventDefault();

    if (key === 'arrowup'    || key === 'w') setDir(0, -1);
    if (key === 'arrowdown'  || key === 's') setDir(0, 1);
    if (key === 'arrowleft'  || key === 'a') setDir(-1, 0);
    if (key === 'arrowright' || key === 'd') setDir(1, 0);

    if (key === ' ' && running && !dead) {
      paused = !paused;
      if (paused) {
        ovTitle.textContent = '已暂停';
        ovSub.innerHTML = '按空格继续';
        ovBtn.textContent = '继 续';
        overlay.classList.add('show');
      } else {
        lastTime = 0;
        overlay.classList.remove('show');
      }
    }
    if (key === 'r') start();
    if (key === 'enter' && !running) start();
  });

  document.querySelectorAll('.dpad button[data-dir]').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = btn.dataset.dir;
      if (d === 'up') setDir(0, -1);
      if (d === 'down') setDir(0, 1);
      if (d === 'left') setDir(-1, 0);
      if (d === 'right') setDir(1, 0);
    });
  });

  // AI 托管开关
  aiBtn.addEventListener('click', () => setAi(!aiOn));

  /* ---- 主题切换（一键生效 + 刷新后保留） ---- */
  themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));

  /* ---- 多局战绩列表 ---- */
  recBtn.addEventListener('click', () => { renderRecords(); modal.classList.add('show'); });
  recClose.addEventListener('click', () => modal.classList.remove('show'));
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('show'); });

  /* ---- 重置统计（二次确认，防误触） ---- */
  let resetArmed = false;
  function disarmReset() {
    resetArmed = false;
    resetBtn.classList.remove('danger-on');
    resetBtn.textContent = '重置统计';
  }
  resetBtn.addEventListener('click', () => {
    if (!resetArmed) {
      resetArmed = true;
      resetBtn.classList.add('danger-on');
      resetBtn.textContent = '再点一次确认';
      setTimeout(() => { if (resetArmed) disarmReset(); }, 2600);
      return;
    }
    disarmReset();
    stats = { rounds: 0, bestHuman: 0, bestAi: 0, certified: false, records: [] };
    saveStats();
    paintStats();
    reset();
  });

  let touchStart = null;
  canvas.addEventListener('touchstart', e => { touchStart = e.touches[0]; }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.clientX;
    const dy = e.changedTouches[0].clientY - touchStart.clientY;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
    touchStart = null;
  }, { passive: true });

  reset();
  running = false;
  paintAiTag();
  paintStats();
  renderRecords();
  draw(0);
  requestAnimationFrame(loop);   // 启动渲染循环（否则游戏不会动）
})();
</script>
</body>
</html>
